services:
  - type: web
    name: interviewpro
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: super_secret_bca_project_jwt_key_2026
      - key: MONGODB_URI
        sync: false
